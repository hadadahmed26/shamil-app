name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Compile and Build APK
      run: |
        mkdir -p app/src/main/java/com/shamil/almaerifa
        mkdir -p app/src/main/res/layout
        
        cp AndroidManifest.xml app/src/main/
        cp MainActivity.java app/src/main/java/com/shamil/almaerifa/
        cp activity_main.xml app/src/main/res/layout/
        
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        include ':app'
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.shamil.almaerifa'
            compileSdk 34
            defaultConfig {
                applicationId "com.shamil.almaerifa"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
        unzip -q gradle-8.1-bin.zip
        export PATH=$PWD/gradle-8.1/bin:$PATH
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: shamil-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
