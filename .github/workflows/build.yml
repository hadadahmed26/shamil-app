name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Gradle
      run: |
        echo "include ':app'" > settings.gradle
        mkdir -p app/src/main
        cp -r AndroidManifest.xml app/src/main/
        cp -r MainActivity.java app/src/main/
        cp -r activity_main.xml app/src/main/
        
        echo 'apply plugin: "com.android.application"' > app/build.gradle
        echo 'android {' >> app/build.gradle
        echo '    compileSdk 34' >> app/build.gradle
        echo '    defaultConfig {' >> app/build.gradle
        echo '        applicationId "com.shamil.almaerifa"' >> app/build.gradle
        echo '        minSdk 21' >> app/build.gradle
        echo '        targetSdk 34' >> app/build.gradle
        echo '    }' >> app/build.gradle
        echo '}' >> app/build.gradle
        echo 'dependencies { implementation "androidx.appcompat:appcompat:1.6.1" }' >> app/build.gradle
        
        echo 'buildscript { repositories { google(); mavenCentral() } dependencies { classpath "com.android.tools.build:gradle:8.1.0" } }' > build.gradle
        echo 'allprojects { repositories { google(); mavenCentral() } }' >> build.gradle
        echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
        
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: shamil-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
